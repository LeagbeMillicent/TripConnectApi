$kind: http-example
request:
  url: "{{baseUrl}}/api/terminals"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "name": "Takoradi Market Circle Terminal",
        "city": "Takoradi",
        "address": "Market Circle",
        "latitude": 4.8975,
        "longitude": -1.7603,
        "activeBayCount": 6,
        "marshalName": "Esi Arthur",
        "marshalPhone": "0244000000"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
