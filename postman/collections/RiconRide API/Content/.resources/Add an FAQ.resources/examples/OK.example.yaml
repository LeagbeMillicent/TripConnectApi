$kind: http-example
request:
  url: "{{baseUrl}}/api/content/faqs"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "question": "Can I pay with Telecel Cash?",
        "answer": "Yes. MTN MoMo, Telecel Cash, AT Money, Visa and Mastercard are accepted.",
        "category": "Payments"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
