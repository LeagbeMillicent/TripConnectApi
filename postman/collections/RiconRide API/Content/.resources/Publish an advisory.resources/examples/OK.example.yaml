$kind: http-example
request:
  url: "{{baseUrl}}/api/content/banners"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "title": "N1 diversion at Kasoa",
        "message": "Expect 30-minute delays on Accra–Cape Coast departures today.",
        "severity": "warning"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
