$kind: http-example
request:
  url: "{{baseUrl}}/api/trips/:id"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: trip-acc-kum-01
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "departureTime": "06:00 AM",
        "status": "boarding"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
