$kind: http-request
description: |-
  CMS. `action`: release | deduct | forfeit. The refund goes back through the gateway to the original payment method. A deposit can only be settled once.

  **Roles:** fleet_manager, system_admin.
url: "{{baseUrl}}/api/rentals/:id/deposit"
method: PATCH
headers:
  Content-Type: application/json
pathVariables:
  - key: id
    value: 623269a5-f452-f201-031d-3f0613496ae0
    disabled: false
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "action": "deduct",
      "deductions": [
        {
          "reason": "Fuel top-up",
          "amount": 150
        }
      ],
      "inspectionNotes": "Returned with a quarter tank; no damage."
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Settle the security deposit.resources/examples
order: 2000
