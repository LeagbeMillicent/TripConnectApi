$kind: http-request
description: |-
  CMS. Prices in GH₵. Images must be https URLs. Plate must be unique.

  **Roles:** fleet_manager, system_admin.
url: "{{baseUrl}}/api/vehicles"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Toyota Land Cruiser Prado TX",
      "category": "SUV",
      "licensePlate": "GW 8942-23",
      "dailyPrice": 950,
      "weeklyPrice": 5800,
      "securityDeposit": 1000,
      "withDriverAllowed": true,
      "selfDriveAllowed": true,
      "driverFeePerDay": 200,
      "features": [
        "4x4 Drive",
        "Leather Interior",
        "GPS Tracker",
        "Comprehensive Insurance"
      ],
      "dvlaRoadworthinessExpiry": "2027-05-15",
      "images": []
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Register a vehicle.resources/examples
order: 2000
