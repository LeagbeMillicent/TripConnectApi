$kind: http-example
request:
  url: "{{baseUrl}}/api/bookings/:id/check-in"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: RC-2026-1234567
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "qrCodeData": "RC-2026-1234567|Accra-Kumasi|SEATS:14,15|Kwame Mensah|GH₵220|SIG:<from the ticket>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
